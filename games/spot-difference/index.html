<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>找不同大冒险 · 联机</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="home-button" href="../index.html">🏠 游戏中心</a>
<div id="app">
  <div id="screen-start" class="screen active">
    <h1>🔍 找不同大冒险</h1>
    <p class="subtitle">联机模式 · 自动同房 · 最多 6 人 · 第一位玩家选择总人数</p>
    <div class="setup-card">
      <div class="online-note">
        不需要房间号，也不支持多个房间。<br>
        第一位玩家选择总人数（支持 1 人）；人数满足后游戏自动开始。
      </div>
      <div class="section-label">房间座位</div>
      <div id="seat-list" class="seat-list"></div>
      <div id="target-controls" class="target-controls hidden">
        <div class="section-label">总人数（第一个人选择）</div>
        <div id="target-buttons" class="target-buttons"></div>
      </div>
      <div id="lobby-status" class="lobby-status"></div>
      <button id="join-btn" class="btn-primary">🚀 自动进入联机房</button>
      <div id="join-status" class="join-status"></div>
    </div>
  </div>

  <div id="screen-game" class="screen">
    <div class="top-bar">
      <div class="level-info">第 <span id="cur-level">1</span> 关 / 共 <span id="total-levels">4</span> 关</div>
      <div class="timer">⏰ <span id="timer">60</span> 秒</div>
      <div class="found-info">已找到 <span id="found-count">0</span> / 3</div>
    </div>
    <div class="online-bar">
      <div class="players" id="online-players"></div>
      <div class="rename-box">
        <input id="rename-input" maxlength="16" placeholder="修改我的名字">
        <button id="rename-btn">保存</button>
      </div>
    </div>
    <div class="player-turn" id="player-turn-banner">🌐 联机房同步中…</div>
    <div class="images-row">
      <div class="img-container">
        <div class="img-label">原图</div>
        <div class="img-frame" id="frame-left"></div>
      </div>
      <div class="img-container">
        <div class="img-label">修改图</div>
        <div class="img-frame" id="frame-right"></div>
      </div>
    </div>
    <div class="feedback-bar" id="feedback-bar"></div>
  </div>

  <div id="screen-result" class="screen">
    <h2>🎉 本局结束！</h2>
    <div id="result-subtitle"></div>
    <h3>🏆 排行榜</h3>
    <div id="leaderboard"></div>
    <div class="result-actions">
      <button id="btn-replay" class="btn-primary">重玩我的挑战</button>
      <button id="btn-home" class="btn-secondary">返回游戏中心</button>
    </div>
  </div>
</div>
<script src="../solo-titles/titles.js" data-title-key="spot"></script>
<script src="game.js"></script>
</body>
</html>
