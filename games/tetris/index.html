<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>俄罗斯方块在线对战</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 联机大厅 -->
  <div id="screen-lobby" class="screen active">
    <h1>🧱 俄罗斯方块在线对战</h1>
    <a class="back-link return-center" href="/games/index.html">← 返回游戏中心</a>
    <div class="lobby-card">
      <label>你的昵称：</label>
      <input id="inp-name" placeholder="输入昵称" maxlength="20" value="">
      <div class="lobby-btns">
        <button id="btn-create" class="btn-primary">🏠 创建房间</button>
      </div>
      <div class="divider">或</div>
      <label>房间码：</label>
      <input id="inp-room" placeholder="输入6位房间码" maxlength="6" style="text-transform:uppercase">
      <button id="btn-join" class="btn-secondary">🚪 加入房间</button>
    </div>
    <div id="lobby-status"></div>
  </div>

  <!-- 等待房间 -->
  <div id="screen-waiting" class="screen">
    <h2>🏠 等待对手加入…</h2>
    <p>房间码：</p>
    <div id="room-code-display" class="room-code">------</div>
    <p class="hint">把房间码告诉你的朋友</p>
    <div id="waiting-status">⏳ 正在等待…</div>
    <button id="btn-cancel" class="btn-secondary">取消</button>
  </div>

  <!-- 游戏界面 -->
  <div id="screen-game" class="screen">
    <div class="top-bar">
      <a class="back-link return-center" href="/games/index.html">← 退出</a>
      <div id="countdown-overlay"><span id="countdown-num"></span></div>
    </div>
    <div class="game-layout">
      <!-- 左侧：对手信息 -->
      <div class="opponent-panel">
        <div class="panel-title">对手: <span id="opp-name">--</span></div>
        <div class="opp-stats">
          <div>分数: <span id="opp-score">0</span></div>
          <div>行数: <span id="opp-lines">0</span></div>
        </div>
        <canvas id="opp-canvas" width="120" height="240"></canvas>
      </div>
      <!-- 中间：己方棋盘 -->
      <div class="main-panel">
        <div class="my-stats">
          <div>分数: <span id="my-score">0</span></div>
          <div>行数: <span id="my-lines">0</span></div>
          <div>等级: <span id="my-level">1</span></div>
        </div>
        <div class="board-wrap">
          <canvas id="my-canvas" width="300" height="600"></canvas>
          <div id="game-over-overlay" class="overlay hidden">
            <div id="go-title"></div>
            <button id="btn-restart" class="btn-primary">🔄 重新开始</button>
            <button id="btn-exit" class="btn-secondary">退出房间</button>
          </div>
          <div id="pause-overlay" class="overlay hidden"><div>⏸ 暂停</div></div>
        </div>
      </div>
      <!-- 右侧：下一块 / 暂存 -->
      <div class="side-panel">
        <div class="mini-box"><div class="mini-label">下一个</div><canvas id="next-canvas" width="100" height="100"></canvas></div>
        <div class="mini-box"><div class="mini-label">暂存 (C)</div><canvas id="hold-canvas" width="100" height="100"></canvas></div>
        <div class="controls-hint">
          <div>← → 移动</div><div>↓ 软降</div><div>↑/X 旋转</div><div>Z 反转</div><div>空格 硬降</div><div>C 暂存</div><div>P 暂停</div>
        </div>
      </div>
    </div>
    <div id="game-msg"></div>
  </div>
</div>
<script src="game.js"></script>
<script>
  document.querySelectorAll('.return-center').forEach(link => {
    link.href = `${location.protocol}//${location.hostname}:8100/games/index.html`;
  });
</script>
</body>
</html>
