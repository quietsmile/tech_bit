<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #000;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    touch-action: none;
  }
  h1 { font-size: 1.5rem; margin-bottom: 8px; }
  .hud {
    display: flex;
    gap: 24px;
    font-size: 1.1rem;
    margin-bottom: 8px;
  }
  .hud span b { color: #7bd88f; }
  #board {
    background: #050505;
    border: 4px solid #333;
    border-radius: 8px;
    box-shadow: 0 12px 35px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.08);
    max-width: 100%;
    width: min(88vw, 520px);
    height: auto;
    max-height: 62vh;
  }
  .game-layout {
    position: relative;
    width: min(100%, 980px);
    margin: 4px auto 0;
    min-height: 520px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .side-panel {
    min-width: 0;
    color: #c8c8c8;
  }
  .side-title {
    margin-bottom: 10px;
    color: #fff;
    font-size: .9rem;
    font-weight: 700;
    text-align: center;
  }
  .left-panel {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .scoreboard-panel {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 170px;
  }
  .controls {
    display: flex;
    gap: 12px;
    margin: 12px 0;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    font-size: 1rem;
    padding: 8px 20px;
    border: none;
    border-radius: 6px;
    background: #7bd88f;
    color: #10231a;
    cursor: pointer;
  }
  button:active { transform: scale(0.96); }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
    margin-top: 0;
  }
  .dpad button {
    font-size: 1.3rem;
    padding: 0;
    background: #202020;
    border: 1px solid #444;
    color: #eee;
  }
  .dpad .blank { visibility: hidden; }
  .scoreboard {
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-height: 100px;
  }
  .score-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 9px;
    border: 1px solid #333;
    border-left: 4px solid var(--player-color, #7bd88f);
    border-radius: 5px;
    background: #111;
    font-size: .86rem;
  }
  .score-row .player-score { color: #fff; font-weight: 800; }
  .score-row.dead { opacity: .5; }
  .score-empty { color: #777; text-align: center; font-size: .82rem; }
  @media (max-width: 760px) {
    .game-layout {
      width: min(100%, 520px);
      min-height: 0;
      flex-direction: column;
      gap: 10px;
    }
    .left-panel, .scoreboard-panel {
      position: static;
      transform: none;
      width: 100%;
    }
    .left-panel { order: 2; }
    #board { order: 1; }
    .scoreboard-panel { order: 3; }
    .scoreboard { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .side-title { margin-bottom: 6px; }
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    text-align: center;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { font-size: 1.6rem; }
  #overlay p { font-size: 1.1rem; color: #bbb; }
  .exit-button {
    position: fixed; top: 14px; right: 14px; z-index: 31;
    border: 1px solid #fecaca; border-radius: 999px; padding: 8px 14px;
    background: #dc2626; color: #fff; font-size: 12px; font-weight: 800;
    box-shadow: 0 8px 20px rgba(127,29,29,.35);
  }
  .exit-button:hover { background: #ef4444; }

    .home-button {
      position: fixed; top: 14px; left: 14px; z-index: 30;
      padding: 8px 13px; border-radius: 999px; text-decoration: none;
      background: rgba(18,30,45,.88); color: #dbeafe; border: 1px solid rgba(125,211,252,.28);
      font-size: 12px; font-weight: 700; backdrop-filter: blur(8px);
    }
    .home-button:hover { border-color: #7dd3fc; color: #fff; }

  </style>
</head>
<body>
  <button id="exitBtn" class="exit-button">退出</button>
  <a class="home-button" href="../index.html">🏠 游戏中心</a>

  <h1>贪吃蛇</h1>
  <div class="hud">
    <span>分数：<b id="score">0</b></span>
    <span>最高分：<b id="best">0</b></span>
  </div>
  <div id="rankList" class="rank-list hidden"></div>
  <div class="food-help">🔴 +1　🟡 +3　⚡ +1分并加速5秒　皇冠属于当前第一名</div>
  <div class="game-layout">
    <div class="side-panel left-panel">
      <div class="side-title">操作方式</div>
      <div class="dpad">
        <button class="blank"></button>
        <button data-dir="up">↑</button>
        <button class="blank"></button>
        <button data-dir="left">←</button>
        <button class="blank"></button>
        <button data-dir="right">→</button>
        <button class="blank"></button>
        <button data-dir="down">↓</button>
        <button class="blank"></button>
      </div>
      <div style="margin-top:8px;text-align:center;font-size:.72rem;color:#888;">WASD / 方向键</div>
    </div>
    <canvas id="board" width="400" height="400"></canvas>
    <div class="side-panel scoreboard-panel">
      <div class="side-title">玩家分数</div>
      <div id="scoreboard" class="scoreboard">
        <div class="score-empty">等待开始</div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button id="pauseBtn">暂停</button>
    <button id="restartBtn">重新开始</button>
  </div>
  <div id="overlay" class="hidden">
    <h2 id="overlayTitle">游戏结束</h2>
    <p id="overlayText"></p>
    <button id="overlayRestart">再来一局</button>
  </div>
  <div id="menu">
    <div class="menu-panel">
      <h2>🐍 贪吃蛇</h2>
      <button id="btnSolo" class="menu-btn primary">🎮 单人游戏</button>
      <button id="btnOnline" class="menu-btn">🌐 联机对战（最多4人）</button>
      <label class="id-label" for="playerIdInput">你的玩家 ID</label>
      <input id="playerIdInput" class="player-id-input" maxlength="3" value="玩家1" autocomplete="off">
      <div id="menuStatus"></div>
    </div>
  </div>
  <style>
    #menu {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(5, 8, 14, 0.88);
      display: flex; align-items: center; justify-content: center;
    }
    #menu.hidden2 { display: none; }
    .rank-list { display: none; }
    .rank-list b { color: #7bd88f; }
    .food-help { margin: 0 0 8px; color: #a7bdd1; font-size: .82rem; text-align: center; }
    .menu-panel {
      width: min(88vw, 340px); padding: 28px 26px; text-align: center;
      background: #141826; border: 1px solid #3a4256; border-radius: 18px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .menu-panel h2 { font-size: 1.5rem; margin-bottom: 4px; }
    .menu-btn { width: 100%; font-size: 1rem; padding: 12px; }
    .menu-btn.primary { background: linear-gradient(120deg, #38bdf8, #4ade80); }
    .join-row { display: flex; gap: 8px; }
    .join-row input {
      flex: 1; padding: 10px 12px; border-radius: 6px; border: 1px solid #3a4256;
      background: #10131b; color: #eee; font-size: 1rem; text-transform: uppercase;
      text-align: center; letter-spacing: 3px; outline: none;
    }
    .join-row .menu-btn { width: auto; padding: 10px 16px; }
    #menuStatus { min-height: 18px; font-size: 0.85rem; color: #fca5a5; }
    .id-label { color: #b8c8d8; font-size: .82rem; text-align: left; }
    .player-id-input { width: 100%; padding: 10px 12px; border: 1px solid #46566d; border-radius: 8px; background: #0e1726; color: #fff; outline: none; }
    .hidden2 { display: none !important; }
  </style>
  <script src="game.js?v=20260928-4"></script>
</body>
</html>
