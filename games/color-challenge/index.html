<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>颜色大挑战</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="home-button" href="../index.html">🏠 游戏大厅</a>
  <div class="container">
    <!-- 开始界面 -->
    <main id="start-screen" class="screen">
      <div class="start-emoji">🎨🔍✨</div>
      <h1>颜色大挑战</h1>
      <p class="intro">一堆颜色里藏着一个“不一样”的色块，<br>用它最快最准的眼力把它揪出来！</p>
      <ul class="rules">
        <li>🧩 共 <b>8</b> 关：从 2×2 开始，到 9×9，格子越来越多</li>
        <li>🎯 每关只有 <b>1</b> 个色块颜色不同，点它！</li>
        <li>🎨 颜色误差一关比一关小，越玩越考验眼力</li>
        <li>❤️ 共 3 颗心：点错或超时扣 1 颗，扣完结束</li>
        <li>⚡ 找得越快，得分越高</li>
      </ul>
      <button id="start-btn" class="btn btn-primary btn-big">🚀 开始挑战</button>
      <p class="best-record" id="best-record">暂无记录，快来创造！</p>
    </main>

    <!-- 游戏界面 -->
    <div id="game-screen" class="hidden">
      <header>
        <div class="header-top">
          <h1>🎨 颜色大挑战</h1>
          <button id="sound-toggle" class="icon-btn" title="切换音效">🔊</button>
        </div>
        <div class="hud">
          <span class="hud-chip">关卡 <b id="level-value">1</b>/8</span>
          <span class="hud-chip">得分 <b id="score">0</b></span>
          <span class="hud-chip hearts-chip">❤️ <b id="hearts">♥♥♥</b></span>
          <span class="hud-chip timer-chip" id="timer-chip">⏱ <b id="timer">20</b>s</span>
        </div>
        <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
      </header>
      <main class="screen game-screen">
        <div class="level-tip" id="level-tip">第 1 关 · 3×3</div>
        <div id="board" class="board" aria-label="色块区域"></div>
        <div class="feedback" id="feedback"></div>
      </main>
    </div>

    <!-- 结果界面 -->
    <main id="result-screen" class="screen hidden">
      <div id="rating-icon" class="rating-icon">🏆</div>
      <h2 id="rating-title">色彩大师</h2>
      <p id="result-level" class="result-level">通过第 8 关</p>
      <p id="rating-desc" class="rating-desc"></p>
      <div class="stats">
        <div class="stat"><span class="stat-num" id="stat-score">0</span><span class="stat-label">总分</span></div>
        <div class="stat"><span class="stat-num" id="stat-level">1</span><span class="stat-label">到达关卡</span></div>
        <div class="stat"><span class="stat-num" id="stat-best">0</span><span class="stat-label">最高分</span></div>
      </div>
      <p id="new-record" class="new-record hidden">🎊 新纪录诞生！</p>
      <div class="result-actions">
        <button id="back-levels-btn" class="btn btn-secondary btn-big">🏠 回到首页</button>
        <button id="restart-btn" class="btn btn-primary btn-big">🔄 再来一局</button>
      </div>
    </main>
  </div>

  <script src="../arena/arena.js"></script>
  <script src="../solo-titles/titles.js" data-title-key="color"></script>
<script src="game.js"></script>
</body>
</html>
