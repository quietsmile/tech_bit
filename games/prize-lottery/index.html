<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 反转盲盒抽奖</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; color: #333; padding: 16px; }
  .card { background: #fff; border-radius: 16px; padding: 20px; max-width: 480px;
    margin: 0 auto 16px; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  h1 { font-size: 24px; text-align: center; margin-bottom: 8px; }
  .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 12px; }
  input, textarea, button, select { font-size: 16px; font-family: inherit; }
  input, textarea { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 10px; margin-bottom: 10px; }
  input:focus { outline: none; border-color: #667eea; }
  button { padding: 10px 18px; border: none; border-radius: 10px; cursor: pointer;
    background: #667eea; color: #fff; font-weight: 600; width: 100%; margin-bottom: 8px; }
  button:active { transform: scale(.98); }
  button.green { background: #2ecc71; }
  button.orange { background: #f39c12; }
  button.gray { background: #95a5a6; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  #conn { position: fixed; top: 10px; right: 10px; padding: 4px 12px; border-radius: 20px;
    font-size: 12px; color: #fff; z-index: 10; }
  #conn.on { background: #2ecc71; }
  #conn.off { background: #e74c3c; }
  .tag { display: inline-block; background: #f0f2ff; color: #667eea; border-radius: 8px;
    padding: 4px 10px; font-size: 13px; margin: 2px; }
  .player-list .pl { display: flex; justify-content: space-between; padding: 6px 0;
    border-bottom: 1px dashed #eee; font-size: 14px; }
  .prize-list .pz { display: flex; justify-content: space-between; padding: 6px 0;
    border-bottom: 1px dashed #eee; font-size: 14px; }
  .hist { font-size: 13px; color: #666; padding: 4px 0; border-bottom: 1px dashed #eee; }
  #stage { text-align: center; }
  #wrapEmoji { font-size: 90px; animation: bounce 1s infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-14px);} }
  @keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-6px);} 75% { transform: translateX(6px);} }
  .shaking { animation: shake .3s infinite; }
  #revealEmoji { font-size: 90px; animation: pop .5s ease; }
  @keyframes pop { 0% { transform: scale(0);} 70% { transform: scale(1.3);} 100% { transform: scale(1);} }
  #eventBanner { font-size: 22px; font-weight: 800; color: #e67e22; margin: 10px 0; }
  .hidden { display: none; }
  .prize-name { font-size: 26px; font-weight: 800; color: #667eea; margin: 8px 0; }
  .room-code { font-size: 32px; font-weight: 800; letter-spacing: 8px; color: #667eea; text-align: center; }
  textarea { height: 90px; resize: vertical; }
  details { margin-bottom: 10px; }
  summary { cursor: pointer; font-weight: 600; color: #667eea; margin-bottom: 8px; }

    .home-button {
      position: fixed; top: 14px; right: 14px; z-index: 30;
      padding: 8px 13px; border-radius: 999px; text-decoration: none;
      background: rgba(18,30,45,.88); color: #dbeafe; border: 1px solid rgba(125,211,252,.28);
      font-size: 12px; font-weight: 700; backdrop-filter: blur(8px);
    }
    .home-button:hover { border-color: #7dd3fc; color: #fff; }

  </style>
</head>
<body>
  <a id="homeButton" class="home-button" href="http://172.20.10.12:8100/games/index.html">🏠 游戏中心</a>

<div id="conn" class="off">连接中…</div>

<!-- 入口 -->
<div class="card" id="entryCard">
  <h1>🎁 反转盲盒抽奖</h1>
  <p class="sub">抽的是奖，玩的是心跳！</p>
  <input id="roomInput" placeholder="输入 4 位房间码" maxlength="4" style="text-transform:uppercase">
  <input id="nameInput" placeholder="你的昵称（最多 12 字）" maxlength="12">
  <button onclick="joinRoom()" class="green">🚪 加入房间</button>
  <details><summary>没有房间？点这里当房主</summary>
    <button onclick="createRoom()" class="orange">🏠 创建新房间</button>
  </details>
  <p class="sub" id="entryMsg"></p>
</div>

<!-- 主界面 -->
<div class="card hidden" id="mainCard">
  <h1 id="mainTitle">🎁 反转盲盒抽奖</h1>
  <p class="sub">房间码</p>
  <div class="room-code" id="roomCode"></div>

  <!-- 舞台 -->
  <div id="stage" class="hidden">
    <div id="wrapPhase" class="hidden">
      <div id="wrapEmoji">📦</div>
      <p id="wrapText" style="font-size:16px; margin:10px 0;"></p>
      <p class="sub">盒子在颤抖……反转即将发生！！</p>
    </div>
    <div id="revealPhase" class="hidden">
      <div id="eventBanner"></div>
      <div id="revealEmoji">🎁</div>
      <div class="prize-name" id="prizeName"></div>
      <p id="extraText" style="font-size:15px; color:#666;"></p>
    </div>
  </div>

  <!-- 抽奖按钮 -->
  <button id="drawBtn" class="green hidden" onclick="draw()">🎁 开抽！</button>

  <!-- 房主面板 -->
  <div id="hostPanel" class="hidden">
    <details><summary>👑 房主面板</summary>
      <input id="prizeNameInput" placeholder="奖品名称，如：贴纸大礼包">
      <div class="row">
        <input id="prizeCountInput" type="number" placeholder="数量" min="1" max="99" value="1">
        <input id="prizeEmojiInput" placeholder="emoji" maxlength="4" value="🎁">
      </div>
      <button onclick="addPrize()" class="orange">➕ 添加奖品</button>
      <details><summary>📋 批量导入（每行一条，可带数量）</summary>
        <textarea id="importText" placeholder="贴纸大礼包 3&#10;卡牌包 2&#10;免作业券"></textarea>
        <button onclick="importPool()" class="orange">📥 导入</button>
      </details>
      <button onclick="resetRoom()" class="gray">🔄 重置房间</button>
    </details>
  </div>

  <!-- 玩家 -->
  <div class="card player-list" style="box-shadow:none; background:#f8f9ff;">
    <b>👥 玩家</b>
    <div id="playerList"></div>
  </div>

  <!-- 奖池 -->
  <div class="card prize-list" style="box-shadow:none; background:#fffaf0;">
    <b>🏆 奖池</b>
    <div id="prizeList"></div>
  </div>

  <!-- 历史 -->
  <div class="card" style="box-shadow:none; background:#f0fff4;">
    <b>📜 抽奖历史</b>
    <div id="histList"></div>
  </div>

  <p class="sub" id="myInfo"></p>
</div>

<script>
var code = localStorage.getItem("pl_code") || "";
var playerId = localStorage.getItem("pl_pid_" + code) || "";
var hostToken = localStorage.getItem("pl_host_" + code) || "";
var lastRound = -1, connOk = false, audioCtx = null;

function beep(freq, dur, type) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function fanfare() { [523, 659, 784, 1047].forEach(function(f, i){ setTimeout(function(){ beep(f, 0.25, "triangle"); }, i * 140); }); }
function drumroll() { for (var i = 0; i < 8; i++) setTimeout(function(){ beep(120 + Math.random() * 60, 0.08, "square"); }, i * 220); }

function api(path, body, cb) {
  fetch(path, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {}) })
    .then(function(r){ return r.json(); }).then(cb).catch(function(){ setConn(false); });
}

function setConn(ok) {
  connOk = ok;
  var el = document.getElementById("conn");
  el.className = ok ? "on" : "off";
  el.textContent = ok ? "● 已连接" : "● 连接断开，重试中…";
}

function joinRoom() {
  var c = document.getElementById("roomInput").value.trim().toUpperCase();
  var n = document.getElementById("nameInput").value.trim();
  if (!c) { document.getElementById("entryMsg").textContent = "请输入房间码"; return; }
  if (!n) { document.getElementById("entryMsg").textContent = "请输入昵称"; return; }
  api("/api/join", { code: c, name: n }, function(res) {
    if (!res.ok) { document.getElementById("entryMsg").textContent = res.error || "加入失败"; return; }
    code = c; playerId = res.player_id;
    localStorage.setItem("pl_code", c);
    localStorage.setItem("pl_pid_" + c, playerId);
    showMain();
    beep(880, 0.15);
  });
}

function createRoom() {
  api("/api/create", {}, function(res) {
    if (!res.ok) return;
    code = res.code; hostToken = res.host_token; playerId = "";
    localStorage.setItem("pl_code", code);
    localStorage.setItem("pl_host_" + code, hostToken);
    localStorage.removeItem("pl_pid_" + code);
    alert("房间创建成功！房间码：" + code + "\n请输入昵称加入自己的房间～");
    document.getElementById("roomInput").value = code;
    showMain();
  });
}

function showMain() {
  document.getElementById("entryCard").classList.add("hidden");
  document.getElementById("mainCard").classList.remove("hidden");
  document.getElementById("roomCode").textContent = code;
  if (hostToken) document.getElementById("hostPanel").classList.remove("hidden");
}

function draw() {
  api("/api/draw", { code: code, player_id: playerId }, function(res) {
    if (!res.ok) { alert(res.error || "抽奖失败"); return; }
    drumroll();
  });
}

function addPrize() {
  api("/api/add_prize", { code: code, host_token: hostToken,
    name: document.getElementById("prizeNameInput").value,
    count: parseInt(document.getElementById("prizeCountInput").value) || 1,
    emoji: document.getElementById("prizeEmojiInput").value || "🎁" }, function(res) {
    if (!res.ok) { alert(res.error); return; }
    document.getElementById("prizeNameInput").value = "";
    beep(660, 0.15);
  });
}

function importPool() {
  api("/api/import_pool", { code: code, host_token: hostToken,
    text: document.getElementById("importText").value }, function(res) {
    if (!res.ok) { alert(res.error); return; }
    document.getElementById("importText").value = "";
    beep(660, 0.15);
  });
}

function resetRoom() {
  if (!confirm("确定重置？所有玩家、历史和奖池都会清空")) return;
  api("/api/reset", { code: code, host_token: hostToken }, function(res) {
    if (res.ok) beep(300, 0.3, "sawtooth");
  });
}

function esc(s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

function render(st) {
  document.getElementById("playerList").innerHTML = st.players.map(function(p) {
    return '<div class="pl"><span>' + esc(p.emoji) + " " + esc(p.name) + (p.id === st.me ? "（我）" : "") +
      '</span><span>' + (p.prizes.length ? p.prizes.map(esc).map(function(x){ return "🏅"+x; }).join(" ") : "") + '</span></div>';
  }).join("") || '<p class="sub">还没有人，快邀请小伙伴！</p>';

  document.getElementById("prizeList").innerHTML = st.prizes.map(function(p) {
    return '<div class="pz"><span>' + esc(p.emoji) + " " + esc(p.name) + '</span><span>×' + p.count + '</span></div>';
  }).join("") || '<p class="sub">奖池空空如也！</p>';

  document.getElementById("histList").innerHTML = st.history.slice().reverse().map(function(h) {
    return '<div class="hist">' + esc(h.player) + " → " + esc(h.prize) + " <small>(" + esc(h.event) + ")</small></div>";
  }).join("") || '<p class="sub">还没有记录，快开始第一抽！</p>';

  var stage = document.getElementById("stage");
  var wrapP = document.getElementById("wrapPhase");
  var revealP = document.getElementById("revealPhase");
  var drawBtn = document.getElementById("drawBtn");

  if (st.drawing && st.drawing.stage === "wrap") {
    stage.classList.remove("hidden"); wrapP.classList.remove("hidden"); revealP.classList.add("hidden");
    drawBtn.classList.add("hidden");
    document.getElementById("wrapEmoji").textContent = st.drawing.wrap_emoji;
    document.getElementById("wrapEmoji").classList.add("shaking");
    document.getElementById("wrapText").textContent = st.drawing.wrap_text;
  } else if (st.drawing && st.drawing.stage === "done" && !st._revealed) {
    st._revealed = true;
    stage.classList.remove("hidden"); wrapP.classList.add("hidden"); revealP.classList.remove("hidden");
    drawBtn.classList.remove("hidden");
    drawBtn.disabled = false;
    drawBtn.textContent = "🎁 再来一抽！";
    document.getElementById("wrapEmoji").classList.remove("shaking");
    document.getElementById("eventBanner").textContent = st.drawing.event.title;
    document.getElementById("revealEmoji").textContent = st.drawing.prize.emoji;
    document.getElementById("prizeName").textContent = st.drawing.prize.name;
    document.getElementById("extraText").textContent = st.drawing.extra;
    fanfare();
    drawBtn.classList.toggle("hidden", st.drawing.player_id !== st.me.id);
  } else if (!st.drawing) {
    stage.classList.add("hidden");
    drawBtn.classList.remove("hidden");
    drawBtn.disabled = !st.me;
    drawBtn.textContent = st.phase === "lobby" ? "🎁 开抽！" : "🎁 再来一抽！";
  }

  if (st.me) {
    document.getElementById("myInfo").textContent = "你好，" + st.me.emoji + " " + st.me.name +
      (st.me.prizes.length ? "，你已获得：" + st.me.prizes.join("、") : "，还没中奖哦～");
  }
}

function poll() {
  if (!code) return;
  fetch("/api/state?code=" + encodeURIComponent(code) + "&player=" + encodeURIComponent(playerId))
    .then(function(r) { if (!r.ok) throw 0; return r.json(); })
    .then(function(st) { setConn(true); render(st); })
    .catch(function() { setConn(false); });
}

// 自动回填房间码
if (code) document.getElementById("roomInput").value = code;
homeButton.href = location.protocol + "//" + location.hostname + ":8100/games/index.html";
setInterval(poll, 1000);
poll();
</script>
</body>
</html>
